# Codemagic – build iOS Cashmeritaly Presenze
# Documentazione: https://docs.codemagic.io/
#
# Prima di usare:
# 1. Carica questo repo / cartella ios su GitHub (o collega il progetto in Codemagic)
# 2. In Codemagic → Team → code signing identities: aggiungi certificato + profilo
#    oppure usa automatic code signing con App Store Connect API key
# 3. Imposta variabili: APP_STORE_CONNECT_ISSUER_ID, KEY_IDENTIFIER, PRIVATE_KEY

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CashmeritalyASC   # nome integrazione in Codemagic (da creare)
    environment:
      ios_signing:
        bundle_identifier: cloud.cashmeritaly.presenze
        provisioning_profiles:
          - name: # nome profilo in Codemagic
        certificates:
          - name: # nome certificato in Codemagic
      vars:
        XCODE_WORKSPACE: ""
        XCODE_PROJECT: "CashmeritalyPresenze/CashmeritalyPresenze.xcodeproj"
        XCODE_SCHEME: "CashmeritalyPresenze"
        APP_STORE_APPLE_ID: # tuo Apple ID numerico app (dopo aver creato l'app su App Store Connect)
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/CashmeritalyPresenze/CashmeritalyPresenze.xcodeproj" \
            --scheme "CashmeritalyPresenze"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
